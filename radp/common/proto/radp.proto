syntax = "proto3";

package radp;

// ---------------------------------------------------------------------------
// Worker service — runs on every Jetson worker. The coordinator drives it.
// ---------------------------------------------------------------------------
service WorkerService {
  // Materialize a stage (contiguous layer range) into the worker's primary slot.
  rpc LoadStage   (LoadStageRequest)  returns (LoadStageResponse);

  // Run one forward pass through the stage on the provided activation tensor.
  rpc RunStage    (RunStageRequest)   returns (RunStageResponse);

  // Load a backup stage (R^-1(k)) into the reserve slot, ready to take over.
  rpc LoadBackup  (LoadBackupRequest) returns (LoadBackupResponse);

  // Activate the backup slot — switch primary execution to the loaded backup.
  rpc PromoteBackup (PromoteBackupRequest) returns (PromoteBackupResponse);

  // Drop the KV cache for a finished (or aborted) request.
  rpc EvictRequest (EvictRequestRequest) returns (EvictRequestResponse);

  // --- Phase D (profiling-based auto-scheduling) ---------------------------

  // Echo bytes back. Coordinator times the round trip to derive its own
  // network link to this worker.
  rpc Ping (PingRequest) returns (PingResponse);

  // Worker becomes a temporary gRPC client of `peer_address` and runs N
  // ping rounds. Returns the measured bandwidth + latency. The coordinator
  // uses this for full-mesh worker↔worker network profiling.
  rpc MeasurePeer (MeasurePeerRequest) returns (MeasurePeerResponse);

  // Run radp.profiler.layer_profiler.profile_layers on this worker against
  // the named model. Model is loaded temporarily, profiled, and unloaded.
  rpc ProfileLayers (ProfileLayersRequest) returns (ProfileLayersResponse);
}

// ---------------------------------------------------------------------------
// Coordinator service — workers and clients talk to it.
// ---------------------------------------------------------------------------
service CoordinatorService {
  // Worker -> coordinator periodic liveness + memory headroom report.
  rpc Heartbeat   (HeartbeatRequest)  returns (HeartbeatResponse);

  // Client -> coordinator token generation, streamed back.
  rpc Generate    (GenerateRequest)   returns (stream GenerateChunk);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------
message LoadStageRequest {
  string device_id   = 1;
  int32  start_layer = 2;   // 1-based inclusive
  int32  end_layer   = 3;   // 1-based inclusive
  string model_id    = 4;   // e.g., "facebook/opt-6.7b"
}

message LoadStageResponse {
  bool   ok    = 1;
  string error = 2;
}

message RunStageRequest {
  bytes activation     = 1;   // serialized tensor payload (hidden + mask)
  int32 request_id     = 2;
  bool  is_prefill     = 3;
  int32 start_layer    = 4;   // Phase 3: which loaded stage to run
  int32 end_layer      = 5;
}

message RunStageResponse {
  bytes activation = 1;
  int32 request_id = 2;
}

message LoadBackupRequest {
  string for_device_id = 1;   // node j whose stage is being mirrored
  int32  start_layer   = 2;
  int32  end_layer     = 3;
  string model_id      = 4;
}

message LoadBackupResponse {
  bool ok = 1;
}

message PromoteBackupRequest {
  string for_device_id = 1;
}

message PromoteBackupResponse {
  bool ok = 1;
}

message EvictRequestRequest {
  int32 request_id = 1;
}

message EvictRequestResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  string device_id          = 1;
  double free_memory_bytes  = 2;
  int64  ts_ns              = 3;
  // --- Phase D additions (sent on every heartbeat; cheap, lets the
  // coordinator track devices that hot-swap or come back with new specs) ---
  double total_memory_bytes = 4;   // 0 if unknown
  string device_class       = 5;   // e.g. "jetson-orin-nano-4gb"; "" if unknown
}

message HeartbeatResponse {
  bool ack = 1;
}

message GenerateRequest {
  string prompt     = 1;
  int32  max_tokens = 2;
  // Sampling — temperature == 0 (default) means greedy argmax.
  double temperature = 3;
  int32  top_k       = 4;   // 0 (default) disables the top-k filter
  double top_p       = 5;   // 0 or >=1 disables the top-p (nucleus) filter
  // EOS stopping — eos_token_id == 0 (default) means disabled.
  int32  eos_token_id = 6;
  // Reproducibility — seed == 0 (default) means use a fresh random generator.
  int64  seed         = 7;
}

message GenerateChunk {
  string text = 1;
  bool   done = 2;
}

// --- Phase D (profiling-based auto-scheduling) -----------------------------

message PingRequest {
  bytes payload  = 1;   // arbitrary blob; size it to measure bandwidth
  int64 sent_ns  = 2;   // sender's monotonic timestamp (for one-way attribution)
}
message PingResponse {
  bytes payload  = 1;   // echoed unchanged
  int64 sent_ns  = 2;   // copy of request.sent_ns
  int64 echo_ns  = 3;   // server-side monotonic timestamp at processing
}

message MeasurePeerRequest {
  string peer_address  = 1;   // e.g., "115.145.158.109:50051"
  int32  payload_bytes = 2;   // per-round payload size
  int32  rounds        = 3;   // number of pings to average
}
message MeasurePeerResponse {
  double bandwidth_bps   = 1;
  double latency_seconds = 2;
  bool   ok              = 3;
  string error           = 4;
}

message ProfileLayersRequest {
  string model_id   = 1;
  int32  warmup     = 2;   // 0 → server default
  int32  repeats    = 3;   // 0 → server default
  int32  seq_length = 4;   // 0 → server default
}
message ProfileLayersResponse {
  // JSON-encoded list[LayerProfile] (compatible with
  // radp.profiler.layer_profiler.{save,load}_profile format).
  bytes  serialized_profiles = 1;
  bool   ok                  = 2;
  string error               = 3;
}
