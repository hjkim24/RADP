syntax = "proto3";

package radp;

// ---------------------------------------------------------------------------
// Worker service — runs on every Jetson worker. The coordinator drives it.
// ---------------------------------------------------------------------------
service WorkerService {
  // Materialize a stage (contiguous layer range) into the worker's primary slot.
  rpc LoadStage   (LoadStageRequest)  returns (LoadStageResponse);

  // Run one forward pass through the stage on the provided activation tensor.
  rpc RunStage    (RunStageRequest)   returns (RunStageResponse);

  // Load a backup stage (R^-1(k)) into the reserve slot, ready to take over.
  rpc LoadBackup  (LoadBackupRequest) returns (LoadBackupResponse);

  // Activate the backup slot — switch primary execution to the loaded backup.
  rpc PromoteBackup (PromoteBackupRequest) returns (PromoteBackupResponse);
}

// ---------------------------------------------------------------------------
// Coordinator service — workers and clients talk to it.
// ---------------------------------------------------------------------------
service CoordinatorService {
  // Worker -> coordinator periodic liveness + memory headroom report.
  rpc Heartbeat   (HeartbeatRequest)  returns (HeartbeatResponse);

  // Client -> coordinator token generation, streamed back.
  rpc Generate    (GenerateRequest)   returns (stream GenerateChunk);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------
message LoadStageRequest {
  string device_id   = 1;
  int32  start_layer = 2;   // 1-based inclusive
  int32  end_layer   = 3;   // 1-based inclusive
  string model_id    = 4;   // e.g., "facebook/opt-6.7b"
}

message LoadStageResponse {
  bool   ok    = 1;
  string error = 2;
}

message RunStageRequest {
  bytes activation     = 1;   // serialized tensor payload (hidden + mask)
  int32 request_id     = 2;
  bool  is_prefill     = 3;
  int32 start_layer    = 4;   // Phase 3: which loaded stage to run
  int32 end_layer      = 5;
}

message RunStageResponse {
  bytes activation = 1;
  int32 request_id = 2;
}

message LoadBackupRequest {
  string for_device_id = 1;   // node j whose stage is being mirrored
  int32  start_layer   = 2;
  int32  end_layer     = 3;
  string model_id      = 4;
}

message LoadBackupResponse {
  bool ok = 1;
}

message PromoteBackupRequest {
  string for_device_id = 1;
}

message PromoteBackupResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  string device_id          = 1;
  double free_memory_bytes  = 2;
  int64  ts_ns              = 3;
}

message HeartbeatResponse {
  bool ack = 1;
}

message GenerateRequest {
  string prompt     = 1;
  int32  max_tokens = 2;
}

message GenerateChunk {
  string text = 1;
  bool   done = 2;
}
