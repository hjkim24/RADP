syntax = "proto3";

package radp;

// ---------------------------------------------------------------------------
// Worker service — runs on every Jetson worker. The coordinator drives it.
// ---------------------------------------------------------------------------
service WorkerService {
  // Materialize a stage (contiguous layer range) into the worker's primary slot.
  rpc LoadStage   (LoadStageRequest)  returns (LoadStageResponse);

  // Run one forward pass through the stage on the provided activation tensor.
  rpc RunStage    (RunStageRequest)   returns (RunStageResponse);

  // Load a backup stage (R^-1(k)) into the reserve slot, ready to take over.
  rpc LoadBackup  (LoadBackupRequest) returns (LoadBackupResponse);

  // Activate the backup slot — switch primary execution to the loaded backup.
  rpc PromoteBackup (PromoteBackupRequest) returns (PromoteBackupResponse);

  // Drop the KV cache for a finished (or aborted) request.
  rpc EvictRequest (EvictRequestRequest) returns (EvictRequestResponse);

  // --- Phase D (profiling-based auto-scheduling) ---------------------------

  // Echo bytes back. Coordinator times the round trip to derive its own
  // network link to this worker.
  rpc Ping (PingRequest) returns (PingResponse);

  // Worker becomes a temporary gRPC client of `peer_address` and runs N
  // ping rounds. Returns the measured bandwidth + latency. The coordinator
  // uses this for full-mesh worker↔worker network profiling.
  rpc MeasurePeer (MeasurePeerRequest) returns (MeasurePeerResponse);

  // Run radp.profiler.layer_profiler.profile_layers on this worker against
  // the named model. Model is loaded temporarily, profiled, and unloaded.
  rpc ProfileLayers (ProfileLayersRequest) returns (ProfileLayersResponse);

  // --- EXP-D3 chain-topology routing ---------------------------------------

  // Tell the worker the gRPC address of the next stage's worker. Set to an
  // empty string to clear (worker becomes the last stage; RunStage will
  // return the activation to the coord instead of forwarding).
  rpc SetNextHop (SetNextHopRequest) returns (SetNextHopResponse);

  // Deploy the head modules (final_layer_norm + project_out + lm_head) to
  // a worker that will serve as the chain tail. Once loaded, RunStage on
  // that worker applies the head + greedy argmax sampling and returns the
  // next_token_id directly instead of the final hidden activation —
  // removing coord from the per-token critical path.
  rpc LoadHead (LoadHeadRequest) returns (LoadHeadResponse);
}

// ---------------------------------------------------------------------------
// Coordinator service — workers and clients talk to it.
// ---------------------------------------------------------------------------
service CoordinatorService {
  // Worker -> coordinator periodic liveness + memory headroom report.
  rpc Heartbeat   (HeartbeatRequest)  returns (HeartbeatResponse);

  // Client -> coordinator token generation, streamed back.
  rpc Generate    (GenerateRequest)   returns (stream GenerateChunk);

  // EXP-D3 Phase 2 — workers ship a copy of the activation they received
  // for (request_id, stage range) back to the coord asynchronously. On
  // worker failure mid-generation the coord replays the mirrored history
  // onto the recovery peer, sidestepping the chain-topology replay gap
  // (coord only sees the first stage's input locally).
  rpc MirrorActivation (MirrorActivationRequest) returns (MirrorActivationResponse);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------
message LoadStageRequest {
  string device_id   = 1;
  int32  start_layer = 2;   // 1-based inclusive
  int32  end_layer   = 3;   // 1-based inclusive
  string model_id    = 4;   // e.g., "facebook/opt-6.7b"
}

message LoadStageResponse {
  bool   ok    = 1;
  string error = 2;
}

message RunStageRequest {
  bytes activation     = 1;   // serialized tensor payload (hidden + mask)
  int32 request_id     = 2;
  bool  is_prefill     = 3;
  int32 start_layer    = 4;   // Phase 3: which loaded stage to run
  int32 end_layer      = 5;
  // EXP-D3 Phase 2: per-(request) step index assigned by the coord.
  // Workers stamp it into MirrorActivation as `position` so out-of-order
  // arrivals collate correctly. 0 = prefill, then +1 per decode token.
  int32 position       = 6;
  // EXP-D3 Phase 3 recovery: when true, the worker runs ONLY its local
  // stage forward (populates its KV cache for this (request, stage,
  // position)) and does NOT chain-forward or head-sample. Used by the
  // gateway's _replay_stage_history to rehydrate a newly-promoted
  // backup without re-running surviving downstream stages.
  bool  replay_only    = 7;
}

message RunStageResponse {
  bytes activation = 1;
  int32 request_id = 2;
  // EXP-D3 Phase 1b: chain tail with a head loaded fills these in and
  // omits the activation. Coord detects has_next_token=true and skips
  // its local lm_head + sampling, going straight to streaming the token.
  bool  has_next_token = 3;
  int32 next_token_id  = 4;
}

message LoadBackupRequest {
  string for_device_id = 1;   // node j whose stage is being mirrored
  int32  start_layer   = 2;
  int32  end_layer     = 3;
  string model_id      = 4;
}

message LoadBackupResponse {
  bool ok = 1;
}

message PromoteBackupRequest {
  string for_device_id = 1;
}

message PromoteBackupResponse {
  bool ok = 1;
}

message EvictRequestRequest {
  int32 request_id = 1;
}

message EvictRequestResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  string device_id          = 1;
  double free_memory_bytes  = 2;
  int64  ts_ns              = 3;
  // --- Phase D additions (sent on every heartbeat; cheap, lets the
  // coordinator track devices that hot-swap or come back with new specs) ---
  double total_memory_bytes = 4;   // 0 if unknown
  string device_class       = 5;   // e.g. "jetson-orin-nano-4gb"; "" if unknown
}

message HeartbeatResponse {
  bool ack = 1;
}

message GenerateRequest {
  string prompt     = 1;
  int32  max_tokens = 2;
  // Sampling — temperature == 0 (default) means greedy argmax.
  double temperature = 3;
  int32  top_k       = 4;   // 0 (default) disables the top-k filter
  double top_p       = 5;   // 0 or >=1 disables the top-p (nucleus) filter
  // EOS stopping — eos_token_id == 0 (default) means disabled.
  int32  eos_token_id = 6;
  // Reproducibility — seed == 0 (default) means use a fresh random generator.
  int64  seed         = 7;
}

message GenerateChunk {
  string text = 1;
  bool   done = 2;
}

// --- Phase D (profiling-based auto-scheduling) -----------------------------

message PingRequest {
  bytes payload  = 1;   // arbitrary blob; size it to measure bandwidth
  int64 sent_ns  = 2;   // sender's monotonic timestamp (for one-way attribution)
}
message PingResponse {
  bytes payload  = 1;   // echoed unchanged
  int64 sent_ns  = 2;   // copy of request.sent_ns
  int64 echo_ns  = 3;   // server-side monotonic timestamp at processing
}

message MeasurePeerRequest {
  string peer_address  = 1;   // e.g., "115.145.158.109:50051"
  int32  payload_bytes = 2;   // per-round payload size
  int32  rounds        = 3;   // number of pings to average
}
message MeasurePeerResponse {
  double bandwidth_bps   = 1;
  double latency_seconds = 2;
  bool   ok              = 3;
  string error           = 4;
}

message ProfileLayersRequest {
  string model_id   = 1;
  int32  warmup     = 2;   // 0 → server default
  int32  repeats    = 3;   // 0 → server default
  int32  seq_length = 4;   // 0 → server default
}
message ProfileLayersResponse {
  // JSON-encoded list[LayerProfile] (compatible with
  // radp.profiler.layer_profiler.{save,load}_profile format).
  bytes  serialized_profiles = 1;
  bool   ok                  = 2;
  string error               = 3;
}

message SetNextHopRequest {
  // Address of the next worker in the chain (e.g., "115.145.158.115:50051").
  // Empty string clears the next-hop, marking this worker as the chain tail.
  string next_address = 1;
  // (start, end) range of THIS worker's stage — used as the lookup key so
  // distinct primary/backup loadouts can register independent next-hops.
  int32 start_layer = 2;
  int32 end_layer   = 3;
  // (start, end) range of the NEXT worker's stage. The forwarder stamps
  // these into the RunStage request it dispatches downstream so the
  // downstream worker's stage_runner can pick the right loaded blocks.
  // Ignored when next_address is empty.
  int32 next_start_layer = 4;
  int32 next_end_layer   = 5;
}
message SetNextHopResponse {
  bool   ok    = 1;
  string error = 2;
}

message LoadHeadRequest {
  string model_id = 1;
}
message LoadHeadResponse {
  bool   ok    = 1;
  string error = 2;
}

message MirrorActivationRequest {
  int32 request_id  = 1;
  int32 start_layer = 2;   // owner stage range (inclusive)
  int32 end_layer   = 3;
  bytes activation  = 4;   // serialized input the worker received
  bool  is_prefill  = 5;
  // Monotonic per-(request, stage) sequence number assigned by the worker.
  // Coord uses it to order out-of-order arrivals from in-flight RPCs and to
  // drop duplicate retries. position == 0 → prefill (first step).
  int32 position    = 6;
}
message MirrorActivationResponse {
  bool ok = 1;
}
