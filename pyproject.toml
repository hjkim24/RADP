[project]
name = "radp"
version = "0.1.0"
description = "Recovery-Aware DP for Distributed LLM Inference on Heterogeneous Edge Clusters"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "torch>=2.1",
  # transformers 5.x calls torch.float8_e8m0fnu (torch 2.7+), but NVIDIA's
  # Jetson torch wheel ships torch 2.5.0a0 → AttributeError at model load.
  # transformers 4.51+ also requires torch >= 2.6 for torch.load (CVE-2025-32434).
  # So pin below 4.51 to support both torch 2.5 (Jetson) and torch 2.8 (PyPI CPU).
  "transformers>=4.40,<4.51",
  "accelerate",
  "grpcio>=1.60",
  "protobuf>=4.25",
  "numpy<2",  # NVIDIA's Jetson torch wheels are NumPy 1.x ABI; 2.x breaks import
  "pyyaml",
  "psutil>=5.9",
  # Coordinator web dashboard (Phase Web0). Embedded uvicorn thread in
  # the radp-coordinator process; tiny RAM footprint.
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-protobuf",
  "types-PyYAML",
  "types-psutil",
]
quant = ["bitsandbytes"]

[project.scripts]
radp-coordinator = "radp.cli.coordinator:main"
radp-worker = "radp.cli.worker:main"
radp-profile = "radp.cli.profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radp"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"radp/common/proto/*" = ["ALL"]

[tool.mypy]
# mypy targets 3.10 (the dev env). 3.9 runtime compatibility is verified by
# ruff (target-version = py39) and by `from __future__ import annotations`
# in every module — annotations become strings at runtime so any modern
# union syntax is safe on 3.9.
python_version = "3.10"
strict = true
files = ["radp"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["radp.common.proto.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["transformers.*", "accelerate.*", "bitsandbytes.*", "grpc.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m 'not slow'"
asyncio_mode = "auto"
markers = [
  "slow: end-to-end tests that download HF weights or hit a network (opt-in via `-m slow`)",
]
