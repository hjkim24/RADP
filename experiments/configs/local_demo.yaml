# Local Phase 2 demo: OPT-125M split across two localhost workers.
# Spawn with experiments/demo_local.sh.

model:
  id: facebook/opt-125m
  dtype: float32
  torch_device: cpu

coordinator:
  bind: "127.0.0.1:50050"

workers:
  - id: worker-a
    address: "127.0.0.1:50051"
  - id: worker-b
    address: "127.0.0.1:50052"

# Manual placement: OPT-125M has 12 decoder layers, split 6-6.
placement:
  - device: worker-a
    start: 1
    end: 6
  - device: worker-b
    start: 7
    end: 12
