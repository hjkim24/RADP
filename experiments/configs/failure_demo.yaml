# Phase 3 failure demo: 3 workers, OPT-125M split 4-4-4.
# Recovery table: each device's backup is its right neighbor (cyclic).

model:
  id: facebook/opt-125m
  dtype: float32
  torch_device: cpu

coordinator:
  bind: "127.0.0.1:50050"
  heartbeat_timeout_seconds: 3.0
  heartbeat_tick_seconds: 0.5

workers:
  - id: worker-a
    address: "127.0.0.1:50051"
  - id: worker-b
    address: "127.0.0.1:50052"
  - id: worker-c
    address: "127.0.0.1:50053"

placement:
  - device: worker-a
    start: 1
    end: 4
  - device: worker-b
    start: 5
    end: 8
  - device: worker-c
    start: 9
    end: 12

# R(j) = k: if j dies, k takes over.
recovery:
  worker-a: worker-b
  worker-b: worker-c
  worker-c: worker-a
