---
# Shared setup: OS packages, time sync, code sync, Python venv with the
# right Jetson torch wheel, radp install, gRPC stubs.

# NOTE on apt vs apt-get: we use raw apt-get here (not the ansible.builtin.apt
# module) because Ansible's apt module needs python3-apt bindings for the
# same interpreter Ansible itself runs on. Ubuntu 20.04 only ships
# python3-apt built for python3.8 ABI, so when we point Ansible at
# python3.9 (JP5 hosts), the apt module can't import it. Shell-based apt-get
# is interpreter-agnostic. Idempotency comes from `changed_when` parsing.
- name: Install OS packages
  ansible.builtin.shell: |
    set -e
    needed="python3 python3-venv python3-pip git libopenblas-base libopenmpi-dev libomp-dev cmake netcat-openbsd"
    missing=""
    for pkg in $needed; do
      dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
    done
    if [ -z "$missing" ]; then
      echo "ALREADY_INSTALLED"
    else
      DEBIAN_FRONTEND=noninteractive apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $missing
    fi
  args:
    executable: /bin/bash
  become: true
  register: _os_pkgs
  changed_when: "'ALREADY_INSTALLED' not in _os_pkgs.stdout"
  tags: [install]

# JP5 hosts (ax-1, ao-2-pre-flash) need python3.9 + python3.9-venv since
# Ubuntu 20.04's default python3 is 3.8 (which radp's >=3.9 requirement
# rejects). Triggered by the radp_python_executable=python3.9 host var.
- name: Install python3.9 + venv (Ubuntu 20.04 / JetPack 5 hosts)
  ansible.builtin.shell: |
    set -e
    needed="python3.9 python3.9-venv python3.9-dev"
    missing=""
    for pkg in $needed; do
      dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
    done
    if [ -z "$missing" ]; then
      echo "ALREADY_INSTALLED"
    else
      DEBIAN_FRONTEND=noninteractive apt-get install -y $missing
    fi
  args:
    executable: /bin/bash
  become: true
  register: _py39_pkgs
  changed_when: "'ALREADY_INSTALLED' not in _py39_pkgs.stdout"
  when: radp_python_executable == "python3.9"
  tags: [install]

- name: Enable NTP time sync (heartbeat timing depends on it)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  become: true
  tags: [install]

- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ radp_install_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  tags: [install]

- name: Clone or update RADP repo
  ansible.builtin.git:
    repo: "{{ radp_repo_url }}"
    dest: "{{ radp_install_dir }}"
    version: "{{ radp_ref }}"
    update: true
    force: true
  # When the working tree advances to a new commit, both the worker and the
  # coordinator units need a restart to pick up the new code. Without this,
  # plain "ansible-playbook playbook.yml" re-installs the editable package
  # but leaves the systemd service running the old import — silently stale.
  # The unified "restart radp service" event is listened to by both the
  # radp-worker and radp-coordinator handlers, so each play routes it to
  # the right unit on its hosts.
  notify: restart radp service
  tags: [install, update]

- name: Create Python venv
  ansible.builtin.command: "{{ radp_python_executable }} -m venv {{ radp_install_dir }}/.venv"
  args:
    creates: "{{ radp_install_dir }}/.venv/bin/python"
  tags: [install]

- name: Upgrade pip in venv
  ansible.builtin.pip:
    name: ["pip", "wheel", "setuptools"]
    state: latest
    virtualenv: "{{ radp_install_dir }}/.venv"
  tags: [install]

- name: Install Jetson-specific PyTorch wheel (if provided)
  ansible.builtin.pip:
    name: "{{ jetson_torch_wheel_url }}"
    virtualenv: "{{ radp_install_dir }}/.venv"
    state: present
  when: jetson_torch_wheel_url | length > 0
  tags: [install]

# Fallback for hosts without a Jetson CUDA wheel (e.g. AGX Xavier on JP5,
# or any AGX Orin still on JP5 pre-flash). Plain PyPI torch is CPU-only on
# aarch64; that's fine for the coordinator (embed + lm_head + sampling) and
# acceptable as a placeholder for not-yet-upgraded workers.
- name: Install generic CPU PyTorch from PyPI (fallback)
  ansible.builtin.pip:
    name: "torch>=2.1,<3.0"
    virtualenv: "{{ radp_install_dir }}/.venv"
    state: present
  when: jetson_torch_wheel_url | length == 0
  tags: [install]

- name: Verify torch is available (any source)
  ansible.builtin.command: "{{ radp_install_dir }}/.venv/bin/python -c \"import torch; print(torch.__version__, torch.cuda.is_available())\""
  register: torch_check
  changed_when: false
  failed_when: torch_check.rc != 0
  tags: [install]

- name: Report torch version + CUDA availability
  ansible.builtin.debug:
    msg: "torch: {{ torch_check.stdout }}"
  tags: [install]

- name: Install RADP package + dev/runtime deps from pyproject (editable)
  ansible.builtin.pip:
    chdir: "{{ radp_install_dir }}"
    name: ".[dev]"
    editable: true
    virtualenv: "{{ radp_install_dir }}/.venv"
    state: present
  tags: [install, update]

# Always regenerate — protoc is deterministic, so re-running is a no-op
# when radp.proto is unchanged. The previous `creates:` guard skipped this
# step on hosts that already had radp_pb2.py from an older proto source,
# silently leaving them on a stale schema (missed total_memory_bytes etc).
- name: Generate gRPC stubs
  ansible.builtin.command: "{{ radp_install_dir }}/.venv/bin/python -m grpc_tools.protoc -I radp/common/proto --python_out=radp/common/proto --grpc_python_out=radp/common/proto radp/common/proto/radp.proto"
  args:
    chdir: "{{ radp_install_dir }}"
  changed_when: false
  tags: [install, update]

- name: Patch generated stub for package-relative import
  ansible.builtin.replace:
    path: "{{ radp_install_dir }}/radp/common/proto/radp_pb2_grpc.py"
    regexp: "^import radp_pb2 as radp__pb2$"
    replace: "from . import radp_pb2 as radp__pb2"
  tags: [install, update]
