---
- name: Render radp-worker systemd unit
  ansible.builtin.template:
    src: radp-worker.service.j2
    dest: /etc/systemd/system/radp-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart radp-worker
  tags: [config, service]

- name: Enable + start radp-worker
  ansible.builtin.systemd:
    name: radp-worker
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [service]
