---
- name: Restart radp-worker
  ansible.builtin.systemd:
    name: radp-worker
    state: restarted
    daemon_reload: true
  become: true
  listen:
    - restart radp-worker
    # Cross-role rebroadcast: common notifies "restart radp service" after
    # a code sync; each play (workers / coordinator) routes it to the
    # right unit via this shared name.
    - restart radp service
